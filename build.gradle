plugins {
    id 'fabric-loom' version '1.9.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

loom {
    mixin { defaultRefmapName = "skyblock-rpg-refmap.json" }
}

sourceSets {
    main {
        java.srcDir 'src/client/java'
        resources.srcDir layout.buildDirectory.dir('generated/bundled-map-resources')
    }
}

repositories { }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    annotationProcessor "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

def bundledMapResources = layout.buildDirectory.dir('generated/bundled-map-resources')
def bundleCommunityMaps = providers.gradleProperty('includeCommunityMaps').map { it.toBoolean() }.orElse(false)
def pythonExecutable = providers.gradleProperty('pythonExecutable').orElse('python')

tasks.register('prepareBundledMapResources') {
    inputs.file('worlds/structures/the_hub_incl_carnival.nbt')
    inputs.file('worlds/structures/gold_mine_modern_version.nbt')
    inputs.file('tools/slice_structure_nbt.py')
    inputs.file('worlds/map_datapack/data/skyblockrpg/skyblock/structures/gold_mine_modern.json')
    outputs.dir(bundledMapResources)
    doLast {
        def outputDir = bundledMapResources.get().asFile
        delete(outputDir)
        if (!bundleCommunityMaps.get()) {
            logger.lifecycle('Community map assets are not bundled. Use -PincludeCommunityMaps=true for a local/private map-enabled build.')
            return
        }

        def sliceDir = layout.buildDirectory.dir('map-build/hub-slices').get().asFile
        delete(sliceDir)
        exec {
            commandLine pythonExecutable.get(), 'tools/slice_structure_nbt.py',
                    'worlds/structures/the_hub_incl_carnival.nbt',
                    '--output', sliceDir.absolutePath,
                    '--slice-x', '96', '--slice-y', '64', '--slice-z', '96'
        }

        def structureDir = new File(outputDir, 'data/skyblockrpg/structures')
        def manifestDir = new File(outputDir, 'data/skyblockrpg/skyblock/structures')
        structureDir.mkdirs()
        manifestDir.mkdirs()

        def index = new groovy.json.JsonSlurper().parse(new File(sliceDir, 'hub_slices.json'))
        def mapSlices = []
        index.slices.each { part ->
            copy {
                from new File(sliceDir, part.file)
                into structureDir
            }
            mapSlices << [structure_id: part.id, offset: part.source_offset, size: part.size]
            def manifest = [
                    id: part.id,
                    name: "Hypixel Hub ${part.id}",
                    template: "skyblockrpg:${part.id}",
                    dimension: 'minecraft:overworld',
                    origin_x: 0, origin_y: 0, origin_z: 0,
                    rotation: 'none', mirror: 'none',
                    max_blocks: part.bounding_box_volume,
                    source: 'Community Hypixel SkyBlock Hub world download',
                    source_url: 'https://hypixel.net/threads/updated-hypixel-skyblock-world-downloads-for-every-single-island.5140617/',
                    license: 'Community asset; redistribution permission not verified. Local/private build only.',
                    test_fixture: false,
                    source_offset: part.source_offset
            ]
            new File(manifestDir, "${part.id}.json").text =
                    groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest)) + System.lineSeparator()
        }

        def hubMap = [
                id: 'hub', name: 'Hub', dimension: 'minecraft:overworld',
                source_size: index.source_size, slices: mapSlices,
                source: 'Community Hypixel SkyBlock Hub world download',
                source_url: 'https://hypixel.net/threads/updated-hypixel-skyblock-world-downloads-for-every-single-island.5140617/',
                license: 'Community asset; redistribution permission not verified. Local/private build only.'
        ]
        def mapDir = new File(outputDir, 'data/skyblockrpg/skyblock/maps')
        mapDir.mkdirs()
        new File(mapDir, 'hub.json').text =
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(hubMap)) + System.lineSeparator()

        copy {
            from 'worlds/structures/gold_mine_modern_version.nbt'
            into structureDir
        }
        copy {
            from 'worlds/map_datapack/data/skyblockrpg/skyblock/structures/gold_mine_modern.json'
            into manifestDir
        }
        def goldMineMap = [
                id: 'gold_mine', name: 'Gold Mine', dimension: 'minecraft:overworld',
                source_size: [80, 142, 112],
                slices: [[structure_id: 'gold_mine_modern', offset: [0, 0, 0], size: [80, 142, 112]]],
                source: 'Community Hypixel SkyBlock island world download',
                source_url: 'https://hypixel.net/threads/updated-hypixel-skyblock-world-downloads-for-every-single-island.5140617/',
                license: 'Community asset; redistribution permission not verified. Local/private build only.'
        ]
        new File(mapDir, 'gold_mine.json').text =
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(goldMineMap)) + System.lineSeparator()
        logger.lifecycle("Prepared ${index.slices.size()} Hub slices and Gold Mine Modern as in-mod structure resources.")
    }
}

tasks.matching { it.name == 'sourcesJar' }.configureEach {
    dependsOn tasks.named('prepareBundledMapResources')
}

tasks.named('processResources') {
    dependsOn tasks.named('prepareBundledMapResources')
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version,
               'minecraft_version': project.minecraft_version
    }
}

// Retained only as a development/export utility; it is not the player-facing delivery path.
tasks.register('stageGoldMineMapDatapack', Sync) {
    from('worlds/map_datapack')
    from('worlds/structures/gold_mine_modern_version.nbt') {
        into 'data/skyblockrpg/structures'
    }
    into layout.buildDirectory.dir('skyblockrpg-map-datapack')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

jar {
    from('LICENSE') { rename { "${it}_${project.archives_base_name}" } }
}
