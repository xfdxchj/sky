plugins {
    id 'fabric-loom' version '1.9.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    mixin {
        defaultRefmapName = "skyblock-rpg-refmap.json"
    }
}

sourceSets {
    main {
        java.srcDir 'src/client/java'
    }
}

repositories {
    // Fabric Loom already configures the Minecraft and Fabric repositories.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    annotationProcessor "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version,
               'minecraft_version': project.minecraft_version
    }
}

// Community map NBTs are deliberately NOT bundled into the mod JAR.
// This task stages a separate local datapack for the map owner to install in a test world.
tasks.register('stageGoldMineMapDatapack', Sync) {
    from('worlds/map_datapack')
    from('worlds/structures/gold_mine_modern_version.nbt') {
        into 'data/skyblockrpg/structures'
    }
    into layout.buildDirectory.dir('skyblockrpg-map-datapack')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}
