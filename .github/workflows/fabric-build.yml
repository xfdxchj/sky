name: Fabric Build

on:
  push:
    paths:
      - "src/**"
      - "build.gradle"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/fabric-build.yml"
      - "worlds/map_datapack/**"
      - "worlds/structures/gold_mine_modern_version.nbt"
      - "tools/slice_structure_nbt.py"
      - "tools/stage_hub_datapack.py"
      - "docs/HUB_MAP_SLICER.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Test structure NBT slicer
        run: python3 tools/slice_structure_nbt.py --self-test
      - name: Validate Hub datapack staging tool
        run: python3 -m py_compile tools/stage_hub_datapack.py
      - name: Build mod
        run: gradle build
      - name: Stage local Gold Mine datapack
        run: gradle stageGoldMineMapDatapack
      - name: Upload local map datapack
        uses: actions/upload-artifact@v4
        with:
          name: skyblockrpg-gold-mine-datapack
          path: build/skyblockrpg-map-datapack/
          if-no-files-found: error
