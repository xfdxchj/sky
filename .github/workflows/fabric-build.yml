name: Fabric Build

concurrency:
  group: fabric-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "src/**"
      - "build.gradle"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/fabric-build.yml"
      - "worlds/map_datapack/**"
      - "worlds/structures/gold_mine_modern_version.nbt"
      - "worlds/structures/the_hub_incl_carnival.nbt"
      - "tools/slice_structure_nbt.py"
      - "docs/HUB_MAP_SLICER.md"
      - "docs/MAP_RUNTIME_IMPLEMENTATION.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Test structure NBT slicer
        run: python3 tools/slice_structure_nbt.py --self-test
      - name: Slice real Hub source (ephemeral CI only)
        run: python3 tools/slice_structure_nbt.py worlds/structures/the_hub_incl_carnival.nbt --output build/hub-slices --slice-x 96 --slice-y 64 --slice-z 96
      - name: Build mod with bundled map resources for packaging verification
        run: gradle build -PincludeCommunityMaps=true -PpythonExecutable=python3
      - name: Verify in-JAR map resources
        run: |
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$JAR"
          jar tf "$JAR" | grep -q 'data/skyblockrpg/structures/hub_x00_y00_z00.nbt'
          jar tf "$JAR" | grep -q 'data/skyblockrpg/structures/gold_mine_modern_version.nbt'
