name: Structure Audit

on:
  push:
    paths:
      - "worlds/structures/**"
      - "tools/inspect_structure_nbt.py"
      - "tools/summarize_structure_audit.py"
      - ".github/workflows/structure-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile audit tools
        run: python -m py_compile tools/inspect_structure_nbt.py tools/summarize_structure_audit.py

      - name: Run structure audit
        run: python tools/inspect_structure_nbt.py worlds/structures --output reports/structure_audit.json

      - name: Summarize structure audit
        run: python tools/summarize_structure_audit.py reports/structure_audit.json --markdown reports/structure_audit_summary.md

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: structure-audit
          path: |
            reports/structure_audit.json
            reports/structure_audit_summary.md
